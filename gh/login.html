<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <link rel="stylesheet" href="/style/responsive.css">
    <link rel="stylesheet" href="/style/portfolio-pages.css">
    <title>С возвращением — CASIO</title>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-brand" href="/gh/main.php" aria-label="CASIO — главная">CASIO<span> / WATCH STORE</span></a>
    <section class="vrap-log" aria-labelledby="auth-heading">
      <p class="auth-eyebrow">Личный кабинет</p>
      <h1 id="auth-heading">С возвращением</h1>
      <p class="auth-description">Войдите, чтобы продолжить покупки.</p>
      <form action="/checkLogin.php" class="login-form" method="post">
        <label for="auth-email">Электронная почта</label>
        <input id="auth-email" type="email" class="input__reg" name="Login" autocomplete="email" placeholder="name@example.com" required maxlength="254">
        <label for="auth-password">Пароль</label>
        <input id="auth-password" type="password" class="input__reg" name="Password" autocomplete="current-password" placeholder="Введите пароль" required minlength="6">
        <button type="submit" class="button__res">Войти</button>
      </form>
      <p class="auth-switch">Нет аккаунта? <a href="/gh/registration.html">Зарегистрироваться</a></p>
    </section>
    <p class="auth-back"><a href="/gh/main.php">← Вернуться в магазин</a></p>
  </main>
</body>
</html>
